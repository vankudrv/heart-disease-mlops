# Prometheus configuration: find the API pods through the Kubernetes API and scrape /metrics from
# each pod separately, so per-pod numbers survive scaling (2 -> 3 pods) without any config change.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: heart-api
    metrics_path: /metrics
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [heart-mlops]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: heart-api
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: http
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

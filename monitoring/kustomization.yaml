# Deploy monitoring with one command:  kubectl apply -k monitoring/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - prometheus.yaml
  - grafana.yaml
configMapGenerator:
  - name: prometheus-config
    namespace: monitoring
    files:
      - prometheus.yml
  - name: grafana-datasource
    namespace: monitoring
    files:
      - grafana/datasource.yaml
  - name: grafana-dashboard-provider
    namespace: monitoring
    files:
      - grafana/dashboard-provider.yaml
  - name: grafana-dashboards
    namespace: monitoring
    files:
      - grafana/heart-api-dashboard.json

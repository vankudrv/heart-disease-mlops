name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test-train:
    name: Lint, test and train
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: python -m flake8 src tests

      - name: Run unit tests
        run: python -m pytest --junitxml=reports/junit.xml

      - name: Train and track models (MLflow)
        run: python -m src.train

      - name: Publish model comparison to the job summary
        run: python scripts/ci_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload training outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-outputs
          path: |
            models/
            reports/
            mlruns/
          if-no-files-found: warn

  docker-build-and-test:
    name: Build and smoke-test the Docker image
    needs: lint-test-train
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t heart-disease-api:ci .

      - name: Start container
        run: docker run -d --name heart-api -p 8000:8000 heart-disease-api:ci

      - name: Wait until the API is healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"
          docker logs heart-api
          exit 1

      - name: Smoke-test /predict
        run: |
          response=$(curl -fsS -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" -d @samples/sample_patient.json)
          echo "$response"
          echo "$response" | python3 -c "import sys, json; d = json.load(sys.stdin); assert d['prediction'] in (0, 1); assert 0.5 <= d['confidence'] <= 1.0"

      - name: Show container logs
        if: always()
        run: docker logs heart-api

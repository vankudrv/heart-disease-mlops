apiVersion: v1
kind: Service
metadata:
  name: heart-api
  namespace: heart-mlops
  labels:
    app: heart-api
spec:
  type: LoadBalancer            # on Minikube the external address appears while `minikube tunnel` runs
  selector:
    app: heart-api
  ports:
    - name: http
      port: 8000
      targetPort: http
